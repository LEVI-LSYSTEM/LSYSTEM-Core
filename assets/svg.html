<!-- SVG спрайты для LSYSTEM Acoustic Toolbox -->
<style>
    /* Стили только для SVG-иконок (не дублируют index.css) */
    .icon-svg {
        width: 1.4em;
        height: 1.4em;
        vertical-align: middle;
        fill: currentColor;
        stroke: none;
        display: inline-block;
        flex-shrink: 0;
        margin-right: 0.4em;
        transition: transform 0.2s ease, width 0.3s ease, height 0.3s ease;
    }

    .icon-svg-sm {
        width: 1em;
        height: 1em;
        margin-right: 0.2em;
    }

    .icon-svg-lg {
        width: 2em;
        height: 2em;
        margin-right: 0.6em;
    }

    .icon-svg-xl {
        width: 3em;
        height: 3em;
        margin-right: 0.8em;
    }

    /* Стили для кнопок с иконками */
    .window-action-btn .icon-svg,
    .layout-toggle-btn .icon-svg,
    .change-type-btn .icon-svg,
    .close-btn .icon-svg {
        margin-right: 0;
        flex-shrink: 0;
    }

    .window-action-btn:hover .icon-svg,
    .layout-toggle-btn:hover .icon-svg,
    .change-type-btn:hover .icon-svg {
        transform: scale(1.15);
    }

    .close-btn:hover .icon-svg {
        transform: scale(1.2);
    }

    /* Адаптивная шапка - иконки сжимаются */
    .window-header-compact .icon-svg {
        width: 1em;
        height: 1em;
    }

    .window-header-minimal .icon-svg {
        width: 0.8em;
        height: 0.8em;
    }

    /* Анимации */
    .icon-spin { animation: icon-spin 2s linear infinite; }
    @keyframes icon-spin { 100% { transform: rotate(360deg); } }

    .icon-pulse { animation: icon-pulse 1.5s ease-in-out infinite; }
    @keyframes icon-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .icon-bounce { animation: icon-bounce 1s ease-in-out infinite; }
    @keyframes icon-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }

    .icon-settings-spin { animation: settings-spin 3s linear infinite; }
    @keyframes settings-spin { 100% { transform: rotate(360deg); } }
</style>
